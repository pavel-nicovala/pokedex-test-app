# Optional: run Cursor Agent in CI using this repo's agent rules (AGENTS.md / .cursor/rules).
# Requires CURSOR_API_KEY in repo secrets. Skip this workflow if you don't use Cursor API.
# See docs: https://cursor.com/docs/cli/github-actions

name: Cursor Agent

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch to diff against (e.g. main)"
        required: false
        default: "main"

jobs:
  cursor-review:
    name: Cursor agent review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          BASE_REF="${{ github.base_ref || github.event.inputs.base_ref || 'main' }}"
          git fetch origin "$BASE_REF"
          git diff "origin/$BASE_REF"...HEAD -- \
            ':(exclude)package-lock.json' \
            ':(exclude)*.lock' \
            > pr-diff.txt
          echo "Diff size: $(wc -l < pr-diff.txt) lines"

      - name: Extract JIRA ticket ID
        id: jira-id
        run: |
          # Match e.g. PROJ-123 in PR title first, then branch name
          TICKET=$(echo "${{ github.event.pull_request.title }}" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then
            TICKET=$(echo "${{ github.head_ref }}" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          fi
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT
          if [ -n "$TICKET" ]; then
            echo "Found JIRA ticket: $TICKET"
          else
            echo "No JIRA ticket ID found in PR title or branch name"
          fi

      - name: Fetch JIRA requirements
        if: steps.jira-id.outputs.ticket != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          TICKET="${{ steps.jira-id.outputs.ticket }}"
          RESPONSE=$(curl -sf \
            -H "Authorization: Basic $(echo -n "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" | base64 -w0)" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/2/issue/$TICKET?fields=summary,description,priority,status" 2>/dev/null) || true

          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq -e '.fields' > /dev/null 2>&1; then
            SUMMARY=$(echo "$RESPONSE" | jq -r '.fields.summary // "(no summary)"')
            DESCRIPTION=$(echo "$RESPONSE" | jq -r '.fields.description // "(no description)"')
            STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name // ""')
            PRIORITY=$(echo "$RESPONSE" | jq -r '.fields.priority.name // ""')

            {
              echo "JIRA Ticket: $TICKET"
              [ -n "$STATUS" ]   && echo "Status: $STATUS"
              [ -n "$PRIORITY" ] && echo "Priority: $PRIORITY"
              echo "Summary: $SUMMARY"
              echo ""
              echo "Description / Requirements:"
              echo "$DESCRIPTION"
            } > jira-requirements.txt
            echo "Fetched requirements for $TICKET"
          else
            echo "::warning::Could not fetch JIRA ticket $TICKET — check JIRA_BASE_URL, JIRA_USER_EMAIL, JIRA_API_TOKEN secrets"
            touch jira-requirements.txt
          fi

      - name: Install Cursor CLI
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Build prompt file
        run: |
          cat > prompt.txt << 'PROMPT_EOF'
          You are reviewing a pull request for a React + Express PokeDex monorepo.
          Project conventions are in AGENTS.md and .cursor/rules/.
          PROMPT_EOF

          if [ -s jira-requirements.txt ]; then
            cat >> prompt.txt << 'PROMPT_EOF'
          The following JIRA ticket describes the requirements for this PR:
          PROMPT_EOF
            cat jira-requirements.txt >> prompt.txt
            echo "" >> prompt.txt
          fi

          cat >> prompt.txt << 'PROMPT_EOF'
          Here is the full diff of this PR:
          PROMPT_EOF
          cat pr-diff.txt >> prompt.txt
          cat >> prompt.txt << 'PROMPT_EOF'
          Review this diff:
          - Do API changes update server, openapi.yaml, AND client together?
          - Are TypeScript types consistent between client and server?
          - Are there obvious bugs or missing test coverage?
          PROMPT_EOF

          if [ -s jira-requirements.txt ]; then
            cat >> prompt.txt << 'PROMPT_EOF'
          - Does the implementation satisfy the requirements stated in the JIRA ticket?
          - Are any acceptance criteria unmet or only partially addressed?
          PROMPT_EOF
          fi

          cat >> prompt.txt << 'PROMPT_EOF'
          Write a concise review (bullet points for issues, a short summary of what looks good). Do NOT modify any files.
          PROMPT_EOF

      - name: Run Cursor Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          AGENT_BIN=$(which agent 2>/dev/null || find "$HOME" -name "agent" -type f 2>/dev/null | head -1)
          echo "Agent binary: $AGENT_BIN"
          echo "::notice::Running Cursor Agent (may take 1-3 minutes)..."
          timeout 480 "$AGENT_BIN" -p --trust --output-format text "$(cat prompt.txt)" 2>&1 | tee cursor-review.txt || true
        continue-on-error: true

      - name: Ensure review file exists
        if: always()
        run: |
          touch cursor-review.txt
          if [ ! -s cursor-review.txt ]; then echo "Cursor Agent did not run (missing CURSOR_API_KEY?) or produced no output." >> cursor-review.txt; fi

      - name: Post review as PR comment
        if: github.event_name == 'pull_request' && hashFiles('cursor-review.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/post-cursor-review.sh

      - name: Upload Cursor review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-agent-review
          path: cursor-review.txt
          retention-days: 7
